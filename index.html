<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>todo-app</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #d1d5db;
    --accent: #2563eb;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #111827;
    --fg: #f3f4f6;
    --muted: #9ca3af;
    --border: #374151;
    --accent: #60a5fa;
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif;
  }
  main { max-width: 32rem; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; }
  button, input {
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.7rem;
  }
  button { cursor: pointer; }
  form { display: flex; gap: 0.5rem; margin: 1rem 0; }
  form input { flex: 1; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: 0.5rem; align-items: center; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li span { flex: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Todo</h1>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
  </header>
  <form id="add-form">
    <input id="new-todo" placeholder="What needs doing?" required>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>
</main>
<script>
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');

  function applyTheme(theme) {
    root.dataset.theme = theme;
    toggle.setAttribute('aria-pressed', String(theme === 'dark'));
  }

  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  toggle.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  const list = document.getElementById('list');
  document.getElementById('add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('new-todo');
    const li = document.createElement('li');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.addEventListener('change', () => li.classList.toggle('done', check.checked));
    const text = document.createElement('span');
    text.textContent = input.value;
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'Delete';
    del.addEventListener('click', () => li.remove());
    li.append(check, text, del);
    list.append(li);
    input.value = '';
  });
</script>
</body>
</html>
